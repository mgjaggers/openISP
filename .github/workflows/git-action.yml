name: openISP quality gates

on:
  push:
    branches: ["master", "kevin-branch"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify checklist traceability
        run: >-
          python tools/export_checklist_manifest.py
          docs/openISP_professional_ISP_checklist_UPDATED_v2.xlsx
          docs/checklist_mapping.json --check
      - name: Verify workbook structure
        run: >-
          python tools/verify_isp_checklist.py
          docs/openISP_professional_ISP_checklist_UPDATED_v2.xlsx
          --manifest docs/checklist_mapping.json
      - name: Run test suite
        run: python -m pytest
      - name: Build distribution
        run: python -m build
